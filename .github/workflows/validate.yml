# Checks the stack's configuration on every push: Prometheus config and
# alert rules (promtool), Alertmanager config (amtool), dashboard JSON,
# and the Compose file.
name: Validate config

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Dashboard JSON
        run: for f in grafana/dashboards/*.json; do jq empty "$f" && echo "ok $f"; done

      - name: Compose file
        run: GRAFANA_ADMIN_PASSWORD=ci docker compose config --quiet
